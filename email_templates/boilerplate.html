<!-- email_template.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Email from Skoolizy</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }
      .container {
        width: 80%;
        margin: 0 auto;
      }
      .logo {
        display: block;
        margin: 20px auto;
        width: 80px;
        height: 80px;
        object-fit: contain;
      }
      .header {
        background-color: #f4f4f4;
        padding: 10px;
        text-align: center;
      }
      .content {
        margin: 30px 0;
        padding: 20px;
        border: 1px solid #ddd;
        background-color: #fff;
        color: #000000bb;
        font-size: 18px;
        line-height: 2;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="logo"
        src="https://res.cloudinary.com/ibraheemsulay/image/upload/v1730302940/logo_tqync6.png"
        alt="skoolizy logo"
      />
      <div class="header">
        <h1>{{title}}</h1>
      </div>
      <div class="content">
        <p>{{message}}</p>
        <p>Best regards,<br />Skoolizy</p>
      </div>
      <div class="footer">
        <p>&copy; 2024 Skoolizy</p>
      </div>
    </div>
  </body>
</html>
